# The checks of the app, defined once: the code builds its messages from this file
# and the guide builds its tables from it (see R/checks_registry.R).
#
# message        the text the user gets; {name} is filled in by the code.
# guide_message  how the guide shows the message ("…" stands for a filled-in part);
#                it defaults to the first line of the message with each {name}
#                replaced by "…".
# fix            what to do, shown in the guide. {{NAME}} in a guide text is replaced
#                by the constant of the same name (see guide_markdown()).
# applies_to     the types of sampling concerned, when not all of them.
# kind           block (default) stops the step; warning only informs.
#
# The order of the checks of a group is the order of its table in the guide.

groups:
  file:
    title: "The file"
    when: "Checked when the file is loaded or applied."
  columns:
    title: "The columns"
    when: "Checked at Apply, in this order."
  parameters:
    title: "The parameters"
    when: "Checked at Apply."
  cluster:
    title: "The cluster design"
    when: "Checked at Apply, once the target is computed."
    note: "The full list of the PSUs or strata concerned can be downloaded from the message."
  draw:
    title: "The draw"
    when: "Checked when Sample is clicked."
    note: "A **warning**, not a block, *{{check_title:exceeds_population}}*, appears after Apply and after Sample when the requested size exceeds a stratum in simple random or PPS sampling: the draw is capped to the population."

checks:
  csv_format:
    group: file
    message: "'{name}' is not a CSV file. Only .csv files are accepted: for an Excel workbook, save the sheet you need as CSV first."
    guide_message: "'…' is not a CSV file. Only .csv files are accepted"
    fix: "save the sheet as CSV"
  csv_unreadable:
    group: file
    message: "'{name}' could not be read as a CSV table (empty or damaged file)."
    guide_message: "'…' could not be read as a CSV table (empty or damaged file)"
    fix: "check the file, export it again"
  file_too_large:
    group: file
    message: "'{name}' is larger than the {limit} MB limit."
    guide_message: "'…' is larger than the {{MAX_UPLOAD_MB}} MB limit"
    fix: "reduce the file (limit shown in *The file*)"
  no_file:
    group: file
    message: "Please upload a CSV file before applying."
    fix: "load a file or use the test data"
  reserved_columns:
    group: columns
    message: "The sampling frame has column(s) with protected names: {columns}.\n\nNames starting with {prefix} are reserved: the tool creates columns with these names during the sampling and in the sample file, so yours would be overwritten or cause an error. Rename or remove them in the CSV."
    guide_message: "The sampling frame has column(s) with protected names"
    fix: "rename or remove the `{{RESERVED_PREFIX}}` columns"
  strata_missing:
    group: columns
    message: "Please select a stratification variable, or set 'Stratified ?' to 'Not stratified'."
    fix: "pick the column, or \"Not stratified\""
  strata_not_found:
    group: columns
    applies_to: "stratified"
    message: "Input strata '{column}' was not found in the uploaded data. Please re-select the column."
    guide_message: "Input strata '…' was not found in the uploaded data"
    fix: "select the column again after changing the file"
  psu_missing:
    group: columns
    applies_to: "cluster type"
    message: "Please select a cluster (PSU) column."
    fix: "pick the column"
  cluster_strata_same:
    group: columns
    applies_to: "cluster type, stratified"
    message: "Cluster and stratification variables must be different columns."
    fix: "use different columns"
  psu_not_found:
    group: columns
    applies_to: "cluster type"
    message: "Input cluster '{column}' was not found in the uploaded data. Please re-select the column."
    guide_message: "Input cluster '…' was not found in the uploaded data"
    fix: "select the column again after changing the file"
  psu_duplicates:
    group: columns
    applies_to: "cluster type"
    message: "Input cluster '{column}' contains duplicate values: the sampling frame must have one row per cluster (PSU), so this column must uniquely identify each cluster."
    guide_message: "… contains duplicate values"
    fix: "one row per PSU"
  population_missing:
    group: columns
    applies_to: "PPS and cluster types"
    message: "Please select a population column for this sampling type."
    fix: "pick the column"
  population_not_found:
    group: columns
    applies_to: "PPS and cluster types"
    message: "Population column '{column}' was not found in the uploaded dataset."
    fix: "select the column again"
  population_not_numeric:
    group: columns
    applies_to: "PPS and cluster types"
    message: "'{column}' is not a numeric column. Select a numeric population column."
    guide_message: "'…' is not a numeric column. Select a numeric population column."
    fix: "pick a numeric column"
  cluster_population_same:
    group: columns
    applies_to: "cluster type"
    message: "Cluster and population variables must be different columns."
    fix: "use different columns"
  strata_population_same:
    group: columns
    applies_to: "PPS and cluster types, stratified"
    message: "Stratification and population variables must be different columns."
    fix: "use different columns"
  population_missing_values:
    group: columns
    applies_to: "PPS and cluster types"
    message: "Population column '{column}' has missing values in {n} row(s): {rows} (header excluded)."
    guide_message: "Population column '…' has missing values in … row(s)"
    fix: "fix or remove the rows listed (header excluded); the list can be downloaded"
  population_negative_values:
    group: columns
    applies_to: "PPS and cluster types"
    message: "Population column '{column}' has negative values in {n} row(s): {rows} (header excluded)."
    guide_message: "Population column '…' has negative values in … row(s)"
    fix: "fix or remove the rows listed (header excluded); the list can be downloaded"
  target_size:
    group: parameters
    message: "Enter a target sample size: a whole number greater than 0."
    fix: "\"{{SAMPLING_MODE_ENTER_SIZE}}\" mode"
  confidence_level:
    group: parameters
    message: "Confidence level must be a number strictly between 0 and 1."
    fix: "for example 0.95"
  error_margin:
    group: parameters
    message: "Error margin must be a number strictly between 0 and 1."
    fix: "for example 0.05"
  buffer:
    group: parameters
    message: "Buffer must be a number greater than or equal to 0."
    fix: "0 for none"
  cluster_size:
    group: parameters
    applies_to: "cluster type"
    message: "Cluster size must be a whole number of at least 2."
    fix: "2 or more"
  icc:
    group: parameters
    applies_to: "cluster type"
    message: "ICC must be a number between 0 and 1."
    fix: "between 0 and 1"
  seed:
    group: parameters
    message: "Seed must be a whole number between -2147483647 and 2147483647."
    fix: "a whole number"
  cluster_psu_too_small:
    group: cluster
    message: "PSUs smaller than the cluster size ({cluster_size}): {n} PSU(s) cannot host a cluster - {examples}.\nReduce the cluster size or filter these PSUs out of the sampling frame."
    guide_message: "PSUs smaller than the cluster size (…): … PSU(s) cannot host a cluster"
    fix: "lower the cluster size, or remove these PSUs from the frame"
  cluster_stratum_capacity:
    group: cluster
    message: "Insufficient stratum capacity: {n} stratum(s) cannot reach their target with clusters of {cluster_size} surveys. Largest shortfalls - {examples}.\nReduce the cluster size or the target sample size, or merge PSUs."
    guide_message: "Insufficient stratum capacity: … stratum(s) cannot reach their target with clusters of …"
    fix: "lower the cluster size or the target, or merge PSUs"
  draw_overflow:
    group: draw
    message: "Draw blocked: {n} PSU(s) were selected several times and would need more surveys than their population - {examples}.\nReduce the cluster size or the target sample size, or merge PSUs."
    guide_message: "Draw blocked: … PSU(s) were selected several times and would need more surveys than their population"
    fix: "lower the cluster size or the target, or merge PSUs; another seed may also avoid it"
  exceeds_population:
    group: draw
    kind: warning
    applies_to: "simple random and PPS types"
    title: "Sample size exceeds population"
    message: "The requested sample size exceeds the available population in stratum(s): {strata}. The sample {tense} capped to the available population there."
    fix: "the draw is capped to the population"

# Sentences the code adds to a message, not shown in the guide
texts:
  population_values_advice: "The population must be a number greater than or equal to 0: fix these values or remove the rows from the sampling frame."
