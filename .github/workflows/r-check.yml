name: R check

on:
  push:
    branches:
      - master
      - "dev[0-9][0-9][0-9][0-9].*"
  pull_request:
    branches:
      - master
      - "dev[0-9][0-9][0-9][0-9].*"

permissions:
  contents: read

jobs:
  r-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::data.table
            any::dplyr
            any::shinyjs
            any::markdown
            any::DT
            any::testthat
            any::shinytest2
            any::withr
            any::rlang

      - name: Check R files parse cleanly
        run: |
          Rscript -e "
            shiny::loadSupport('.', renv = globalenv(), globalrenv = globalenv())
            for (f in c('ui.R', 'server.R')) {
              source(f, local = new.env())
            }
            cat('R files parsed successfully\n')
          "

      - name: Run the tests
        env:
          NOT_CRAN: true
        run: Rscript -e "shinytest2::test_app()"
