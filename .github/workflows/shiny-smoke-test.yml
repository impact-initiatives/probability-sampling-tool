name: Shiny smoke test

on:
  push:
    branches:
      - master
      - "dev[0-9][0-9][0-9][0-9].*"
  pull_request:
    branches:
      - master
      - "dev[0-9][0-9][0-9][0-9].*"

permissions:
  contents: read

jobs:
  shiny-smoke-test:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::data.table
            any::dplyr
            any::shinyjs
            any::markdown
            any::DT

      - name: Launch Shiny app smoke test
        run: |
          Rscript -e "options(shiny.launch.browser = FALSE); shiny::runApp('.', port = 3838)" &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3838/ > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3838/ | grep -q "Probability sampling tool"
          echo "Shiny app answered"
