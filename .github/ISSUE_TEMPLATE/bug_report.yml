name: Bug report
description: File a bug report
title: "[BUG] Brief but specific description of the issue"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Please complete the fields below.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: |
        What did you expect to happen, and what actually happened?
        Include any error messages, unexpected output, or screenshots if relevant.
      placeholder: "I expected to see `...`, but instead I saw `...`."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: |
        Please provide a minimal, self-contained, and reproducible example.
        If possible, include the actions taken and the data used.
      placeholder: |
        1. Open the app
        2. Select the sampling mode
        3. Upload the CSV
        4. Click Apply
        5. Observe the issue
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Anything else?
      description: |
        Include screenshots, links to related issues, or anything else that might help.
